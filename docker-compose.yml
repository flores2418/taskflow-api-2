services:
  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: ./api
    image: taskflow-api:1.0.0
    environment:
      PORT: 3000
      MONGO_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      MONGO_DB_NAME: ${MONGO_DB_NAME}
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL}
    image: taskflow-web:1.0.0
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data: